services:
  - type: web
    name: mealsync-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: ALLOWED_ORIGINS
        value: "https://aws-hackathon-six.vercel.app,*"
      - key: MONGODB_URI
        sync: false
